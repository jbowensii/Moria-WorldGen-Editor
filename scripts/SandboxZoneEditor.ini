; SandboxZoneEditor user state file
; Personal paths, layout offsets, and last-selected views are written here at
; runtime. Distributed defaults are conservative; the editor will rewrite the
; file the first time you save preferences.
;
; To override paths to external tools (UAssetGUI, retoc) and your game install,
; either edit the [paths] section below or use File -> Settings inside the
; editor. The file is created at the same directory as SandboxZoneEditor.py.

[paths]
; Path to your Return to Moria install (folder containing the game's Content/Paks)
game_path = C:\Path\To\ReturnToMoria
; Path to UAssetGUI.exe (used for tojson / fromjson)
uassetgui_path = C:\Path\To\UAssetGUI.exe
; Path to retoc.exe (used for to-zen IoStore packaging)
retoc_path = C:\Path\To\retoc.exe
; Working directory containing the decompiled DataTable JSONs
working_dir = C:\Path\To\WorkingDir

[sort]
zones = layer|1
landmarks = name|0
strings_tree = key|0
mappings = layer|0
bubbles = name|0
chapters = name|0
connections = name|0
biomes = name|0

[locks]

[build]
mod_version = 2.5.3

[filters]
connections_zoneset = SandboxSmall
connections_orphans_only = 0
map_show_connections = 1
map_show_labels = 1
map_show_landmarks = 1
map_hide_unpinned = 0
map_layout_mode = True positions (X,Y,Z)
map_chapter_filter =
map_yaw = 0.0
map_pitch = 0.0
map_scale = 20.0
map_offset_x = 0.0
map_offset_y = 0.0
